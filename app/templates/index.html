{% extends "base.html" %}
{% block title %}论文检索 - {{ app_title }}{% endblock %}
{% block content %}
<section class="hero">
  <h2>论文检索</h2>
  <form hx-post="/api/search" hx-target="#results" hx-swap="innerHTML" hx-ext="json-enc">
    <input type="text" name="query" placeholder="输入关键词，例如 LoRA fine-tuning" required>
    <input type="hidden" name="source" value="arxiv">
    <button type="submit">搜索</button>
  </form>
</section>
<div id="results"></div>
{% endblock %}
