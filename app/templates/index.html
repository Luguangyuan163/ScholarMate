{% extends "base.html" %}
{% block title %}论文检索 - {{ app_title }}{% endblock %}
{% block content %}
<section class="hero">
  <p class="kicker">ScholarMate · Academic Search</p>
  <h2>检索论文</h2>
  <form hx-post="/api/search" hx-target="#results" hx-swap="innerHTML" hx-ext="json-enc" x-data="{ source: 'arxiv' }">
    <input type="text" name="query" placeholder="输入关键词，例如 LoRA fine-tuning" required>
    <input type="hidden" name="source" :value="source">
    <button type="submit">检索</button>
    <div class="source-switch">
      <button type="button" class="tag" :class="{ 'selected': source === 'arxiv' }" @click="source = 'arxiv'">arXiv</button>
      <button type="button" class="tag" :class="{ 'selected': source === 's2' }" @click="source = 's2'">Semantic Scholar</button>
      <button type="button" class="tag" :class="{ 'selected': source === 'local' }" @click="source = 'local'">本地论文库</button>
    </div>
  </form>
</section>
<div id="results"></div>
<script>
  // 检索结果「导入并翻译」：下载 PDF 入库后跳转到翻译工作台
  document.addEventListener("click", async (event) => {
    const button = event.target.closest(".import-translate");
    if (!button || button.disabled) return;
    button.disabled = true;
    const label = button.textContent;
    button.textContent = "导入中…";
    try {
      const resp = await fetch("/api/pdf/import-url", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          url: button.dataset.url,
          title: button.dataset.title || "",
        }),
      });
      if (!resp.ok) {
        const body = await resp.json().catch(() => ({}));
        alert("导入失败: " + (body.detail || ("HTTP " + resp.status)));
        return;
      }
      const data = await resp.json();
      window.location.href = "/translate?pdf=" + data.pdf_id;
    } catch (err) {
      alert("导入失败: " + err.message);
    } finally {
      button.disabled = false;
      button.textContent = label;
    }
  });
</script>
{% endblock %}
