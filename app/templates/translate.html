{% extends "base.html" %}
{% block title %}PDF 翻译 - {{ app_title }}{% endblock %}
{% block content %}
<section x-data="translateApp()" class="translate-page">
  <header class="page-head">
    <h2>PDF 翻译</h2>
    <p class="hint">上传论文 PDF，或从论文库选择已处理完成的论文，逐段翻译并双语对照阅读。</p>
  </header>

  <div class="card translate-controls">
    <form class="row" @submit.prevent="uploadAndTranslate($event)">
      <input type="file" accept="application/pdf" :disabled="busy">
      <button type="submit" :disabled="busy" x-text="busy ? '处理中…' : '上传并翻译'"></button>
    </form>
    <div class="row">
      <label>
        目标语言
        <select x-model="targetLang" :disabled="busy">
          <option value="zh">中文</option>
          <option value="en">English</option>
        </select>
      </label>
      <label>
        段落上限
        <input type="number" x-model.number="maxParagraphs" min="1" placeholder="留空=全部" :disabled="busy">
      </label>
      <label>
        从论文库选择
        <select x-model="selectedPdf" @change="translateSelected()" :disabled="busy">
          <option value="">-- 选择已上传论文 --</option>
          <template x-for="p in papers" :key="p.id">
            <option :value="p.id" x-text="p.filename + '（' + p.status + '）'"></option>
          </template>
        </select>
      </label>
    </div>
  </div>

  <div class="translate-status" x-show="status" x-text="status"></div>

  <div class="segments">
    <template x-for="(seg, i) in segments" :key="i">
      <div class="segment">
        <div class="segment-head">
          <span class="segment-index" x-text="'§ ' + (i + 1)"></span>
        </div>
        <div class="segment-src" x-text="seg.source"></div>
        <div class="segment-trans" x-text="seg.translation"></div>
      </div>
    </template>
    <div class="placeholder" x-show="!segments.length && !busy && !status">上传 PDF 后，双语对照将显示在这里。</div>
  </div>
</section>
{% endblock %}
{% block scripts %}
<script src="/static/js/translate.js" defer></script>
{% endblock %}
