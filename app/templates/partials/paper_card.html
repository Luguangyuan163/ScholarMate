<li class="paper-card">
  <span class="cite-index">[{{ idx }}]</span>
  <div>
    <h3><a href="{{ item.url }}" target="_blank" rel="noopener">{{ item.title }}</a></h3>
    <p class="meta">
      <span class="tag tag-source">{{ item.source }}</span>
      <span class="tag tag-cites">被引 {{ item.citation_count }}</span>
      {{ item.authors | join("、") }} · {{ item.year or "N/A" }}
    </p>
    <p class="abstract">{{ item.abstract[:200] }}{% if item.abstract|length > 200 %}…{% endif %}</p>
    {% if item.pdf_url %}
    <p class="paper-card-actions">
      <a class="btn btn-sm btn-outline" href="{{ item.pdf_url }}" target="_blank" rel="noopener">打开 PDF</a>
      <button class="btn btn-sm btn-outline import-translate" type="button"
              data-url="{{ item.pdf_url }}" data-title="{{ item.title }}">导入并翻译</button>
    </p>
    {% endif %}
  </div>
</li>
