[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scholar-mate"
version = "0.1.0"
description = "面向学术论文的智能检索、翻译与分类 Agent 桌面应用（毕业设计）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "python-multipart>=0.0.12",
    "jinja2>=3.1,<4.0",
    "sqlalchemy>=2.0,<3.0",
    "aiosqlite>=0.20",
    "aiomysql>=0.2,<1.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
    "httpx>=0.28,<1.0",
    "aiofiles>=24.0,<25.0",
    "tenacity>=9.0,<10.0",
    "tiktoken>=0.8,<1.0",
    "pywebview>=5.0,<6.0",
]

[project.optional-dependencies]
llm = [
    "openai>=1.0,<2.0",
    "anthropic>=0.40,<1.0",
]
rag = [
    "chromadb>=0.5,<1.0",
]
pdf = [
    "pymupdf>=1.24,<2.0",
    "pdfplumber>=0.11,<1.0",
    "pytesseract>=0.3,<1.0",
]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=6.0,<8.0",
    "ruff>=0.6,<1.0",
    "pyinstaller>=6.0,<7.0",
    "pip-audit>=2.7,<3.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 90
